# Optional local hooks: `pipx install pre-commit && pre-commit install`
repos:
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.56.1
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
