name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build every artifact but publish nothing (dry run).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: jxscout-rs

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, zig: false }
          - { target: x86_64-apple-darwin, os: macos-latest, zig: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # Static musl binaries for both Linux arches, cross-compiled with zig
      # as the C compiler (needed for bundled SQLite and aws-lc).
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - if: matrix.zig
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.zig }}" == "true" ]]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package
        id: pkg
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || version="dev"
          name="${BIN}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Smoke test (native targets only)
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: ./.github/smoke-test.sh "target/${{ matrix.target }}/release/${BIN}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # Run the cross-compiled arm64 musl binary on a real arm64 runner.
  smoke-arm64:
    name: smoke (aarch64-unknown-linux-musl)
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-aarch64-unknown-linux-musl"
          path: artifacts
          merge-multiple: true
      - name: Smoke test
        run: |
          tar -xzf artifacts/*.tar.gz -C artifacts
          ./.github/smoke-test.sh artifacts/*/jxscout-rs

  caido-plugin:
    name: Caido plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/caido
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: integrations/caido/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: integrations/caido/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: |
          cp dist/plugin_package.zip jxscout-rs-caido-plugin.zip
          shasum -a 256 jxscout-rs-caido-plugin.zip > jxscout-rs-caido-plugin.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caido-plugin
          path: |
            integrations/caido/jxscout-rs-caido-plugin.zip
            integrations/caido/jxscout-rs-caido-plugin.zip.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub release
    # Only a real tag push publishes; a manual run against a tag stays a dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, caido-plugin, smoke-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          cat ./*.sha256 > checksums.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag \
            ./*.tar.gz ./*.sha256 ./*.zip checksums.txt
      # The Homebrew tap (hacker1db/homebrew-tap) polls for new releases on a
      # schedule and opens a formula-bump PR, so no cross-repo token is
      # needed. If TAP_DISPATCH_TOKEN is configured, nudge it immediately.
      - name: Notify Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hacker1db/homebrew-tap/dispatches \
            -d "{\"event_type\":\"jxscout-rs-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
